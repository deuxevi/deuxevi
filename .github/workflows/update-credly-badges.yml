name: Mise à jour des badges Credly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les badges Credly
        env:
          CREDLY_USER: marcel-deuxevi
        run: python scripts/update_credly_badges.py

      - name: Commit si le README a changé
        run: |
          if git diff --quiet README.md; then
            echo "Aucun nouveau badge."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Mise à jour des badges Credly"
          git pull --rebase
          git push
