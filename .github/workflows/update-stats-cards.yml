name: Mise à jour des cartes de stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/update-stats-cards.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Carte des stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=deuxevi&show_icons=true&include_all_commits=true&theme=dark&hide_border=true&locale=fr&custom_title=Stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Carte des langages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=deuxevi&layout=compact&card_width=320&langs_count=5&theme=dark&hide_border=true&locale=fr&custom_title=Langages
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit des cartes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Mise à jour des cartes de stats" || exit 0
          git pull --rebase
          git push
